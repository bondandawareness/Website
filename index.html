<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bond & Awareness</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #fafaf7;
            --ink: #111111;
            --muted: #6b6b6b;
            --line: #e5e5e0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            background: var(--bg);
            color: var(--ink);
            font-family: 'Inter', -apple-system, sans-serif;
            font-weight: 400;
            -webkit-font-smoothing: antialiased;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 48px 24px;
            position: relative;
            overflow-x: hidden;
        }

        /* dot pattern — slightly more visible */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image: radial-gradient(circle at 1px 1px, rgba(0,0,0,0.07) 1px, transparent 0);
            background-size: 24px 24px;
            pointer-events: none;
            z-index: 0;
        }

        .container {
            width: 100%;
            max-width: 460px;
            position: relative;
            z-index: 1;
            animation: fadeUp 0.9s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ── Profile ── */
        .profile {
            text-align: center;
            margin-bottom: 24px;
            animation: fadeUp 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.1s both;
        }

        .avatar-link {
            display: inline-block;
            text-decoration: none;
            border-radius: 50%;
            transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .avatar-link:hover { transform: scale(1.04); }

        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: var(--ink);
            overflow: hidden;
            margin: 0 auto 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            border: 3px solid #fff;
        }
        .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }

        .brand-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 18px;
            margin-bottom: 10px;
        }

        .brand {
            display: inline-flex;
            align-items: baseline;
            justify-content: center;
            gap: 0.22em;
            font-family: 'DM Sans', sans-serif;
            font-weight: 500;
            font-size: 34px;
            line-height: 1;
            letter-spacing: -0.04em;
            color: var(--ink);
        }
        .brand .amp { font-weight: 400; }

        /* micro-bio */
        .bio {
            font-size: 12px;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--muted);
            font-family: 'Inter', sans-serif;
        }

        /* ── SHOP button ── */
        .shop-btn-wrap {
            margin-bottom: 32px;
            animation: fadeUp 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.15s both;
        }

        .shop-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 15px 48px;
            background: var(--ink);
            color: #ffffff;
            text-decoration: none;
            font-family: 'DM Sans', sans-serif;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.02em;
            border-radius: 4px;
            width: 100%;
            border: 2.5px solid var(--ink);
            transition: background 0.3s ease, box-shadow 0.3s ease, transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .shop-btn:hover {
            background: #2a2a2a;
            box-shadow: 0 8px 28px rgba(0,0,0,0.22);
            transform: translateY(-2px);
        }

        .shop-btn-icon {
            width: 22px;
            height: 22px;
            flex-shrink: 0;
        }

        /* ── Divider ── */
        .divider {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 32px 0 16px;
            animation: fadeUp 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.2s both;
        }
        .divider-label {
            font-size: 10px;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: var(--muted);
        }

        /* ── Links ── */
        .links {
            display: flex;
            flex-direction: column;
            gap: 0;
            border-top: 1px solid var(--line);
            animation: fadeUp 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.25s both;
        }

        .link {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 18px 4px;
            border-bottom: 1px solid var(--line);
            color: var(--ink);
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            letter-spacing: -0.005em;
            transition: padding 0.35s cubic-bezier(0.22, 1, 0.36, 1), background 0.35s ease, color 0.35s ease;
        }

        .link:hover {
            padding-left: 16px;
            padding-right: 16px;
            background: var(--ink);
            color: var(--bg);
            border-bottom-color: var(--ink);
        }

        .link-icon { width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .link-icon svg { width: 100%; height: 100%; transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1); }
        .link:hover .link-icon svg { transform: scale(1.08); }
        .link-label { flex: 1; }

        .link-arrow {
            width: 14px; height: 14px; opacity: 0.4;
            transition: opacity 0.35s ease, transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .link:hover .link-arrow { opacity: 1; transform: translate(3px, -3px); }

        /* ── Footer ── */
        .footer {
            margin-top: 48px;
            animation: fadeUp 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.4s both;
        }
        .footer-mark {
            font-size: 11px;
            color: var(--muted);
            font-weight: 400;
        }

        @media (max-width: 480px) {
            body { padding: 32px 20px; align-items: flex-start; }
            .brand { font-size: 26px; }
            .avatar { width: 90px; height: 90px; }
        }
    </style>
</head>
<body>
