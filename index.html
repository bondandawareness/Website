<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Il Mio Profilo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            width: 100%;
        }

        .profile {
            text-align: center;
            margin-bottom: 40px;
        }

        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
            border: 4px solid white;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .name {
            color: white;
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .bio {
            color: rgba(255, 255, 255, 0.9);
            font-size: 16px;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .link-button {
            display: block;
            padding: 16px 24px;
            background: white;
            color: #667eea;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            cursor: pointer;
            border: none;
        }

        .link-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
            background: rgba(255, 255, 255, 0.95);
        }

        .link-button:active {
            transform: translateY(-1px);
        }

        .link-button.primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .link-button.primary:hover {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            filter: brightness(1.1);
        }

        .social-links {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 40px;
        }

        .social-icon {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            text-decoration: none;
            font-size: 20px;
            transition: all 0.3s ease;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        .social-icon:hover {
            background: rgba(255, 255, 255, 0.4);
            border-color: rgba(255, 255, 255, 0.6);
            transform: translateY(-3px);
        }

        .footer {
            text-align: center;
            color: rgba(255, 255, 255, 0.7);
            font-size: 12px;
            margin-top: 50px;
        }

        @media (max-width: 480px) {
            .name {
                font-size: 28px;
            }

            .bio {
                font-size: 14px;
            }

            .link-button {
                padding: 14px 20px;
                font-size: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="profile">
            <div class="avatar">👤</div>
            <h1 class="name">Il Tuo Nome</h1>
            <p class="bio">Ciao! Sono appassionato di tecnologia, design e innovazione. Scopri di più su di me attraverso i link qui sotto.</p>
        </div>

        <div class="links">
            <a href="https://yourportfolio.com" class="link-button primary">🔗 Il Mio Portfolio</a>
            <a href="https://github.com" class="link-button">💻 GitHub</a>
            <a href="https://linkedin.com" class="link-button">💼 LinkedIn</a>
            <a href="https://twitter.com" class="link-button">𝕏 Twitter</a>
            <a href="https://instagram.com" class="link-button">📸 Instagram</a>
            <a href="mailto:tuoemail@example.com" class="link-button">📧 Email</a>
        </div>

        <div class="social-links">
            <a href="https://github.com" class="social-icon" title="GitHub">🔗</a>
            <a href="https://linkedin.com" class="social-icon" title="LinkedIn">💼</a>
            <a href="https://twitter.com" class="social-icon" title="Twitter">𝕏</a>
            <a href="https://instagram.com" class="social-icon" title="Instagram">📸</a>
        </div>

        <div class="footer">
            <p>© 2024 Il Tuo Nome | Creato con ❤️</p>
        </div>
    </div>
</body>
</html>
